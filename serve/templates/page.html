{{define "page"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Base}}/assets/notekit.css">
<script src="{{.Base}}/assets/htmx.min.js" defer></script>
<script src="{{.Base}}/assets/notekit.js" defer></script>
</head>
<body data-nk-doc="{{.Fingerprint}}">
<main>
  <h1 class="nk-title">{{.Title}}</h1>
  <p class="nk-path">{{.Path}}</p>

  {{if .Cells}}
  <p><button class="nk-btn"
             hx-post="{{.Base}}/cells/run-all"
             hx-swap="none">Run all</button></p>
  {{end}}

  {{template "prose" .Preamble}}

  {{range .Cells}}{{template "cell" .}}{{end}}

  {{template "addcell" .AddCell}}
</main>
</body>
</html>{{end}}
