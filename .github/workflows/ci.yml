name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt needed in:"
            gofmt -l .
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # Fuzz smoke runs land once the targets exist (M0a/M0b). Byte-identical
      # round-trip is the property; seeds come from the conformance corpus.
      # - name: fuzz (smoke)
      #   run: |
      #     go test -run '^$' -fuzz FuzzMetaRoundTrip -fuzztime 20s ./meta
      #     go test -run '^$' -fuzz FuzzDocRoundTrip -fuzztime 20s ./doc
